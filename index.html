<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر شعر نیما اکبری</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #000000;
            color: #e8e8f0;
            line-height: 2.2;
            overflow-x: hidden;
            font-weight: 500;
        }

        /* ===== آسمان شب کاملاً سیاه ===== */
        .night-sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at top, #0a0a14 0%, #000000 50%, #000000 100%);
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle 4s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.3); }
        }

        header {
            position: relative;
            padding: 80px 20px 60px;
            text-align: center;
            overflow: hidden;
        }

        /* ===== هلال ماه ساده ===== */
        .moon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 40px;
            position: relative;
            background: transparent;
            box-shadow: -20px 10px 0 0 #f5e6a8;
            transform: rotate(-20deg);
            animation: moonGlow 6s infinite ease-in-out;
        }

        @keyframes moonGlow {
            0%, 100% {
                box-shadow: -20px 10px 0 0 #f5e6a8;
                filter: drop-shadow(0 0 20px rgba(245, 230, 168, 0.4));
            }
            50% {
                box-shadow: -20px 10px 0 0 #fff8dc;
                filter: drop-shadow(0 0 35px rgba(245, 230, 168, 0.7));
            }
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #f5e6a8, #fff, #c9b3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #b8b8d0;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .divider {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #f5e6a8, transparent);
            margin: 30px auto 0;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 25px 100px;
        }

        /* ===== کارت‌های شعر ===== */
        .poem-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 40px 35px;
            margin-bottom: 45px;
            backdrop-filter: blur(8px);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .poem-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, #f5e6a8, #c9b3ff, transparent);
            opacity: 0.5;
        }

        .poem-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(245, 230, 168, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        }

        .poem-title {
            font-size: 1.3rem;
            color: #f5e6a8;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .poem-text {
            font-size: 1.15rem;
            color: #e0e0f0;
            line-height: 2.4;
            white-space: pre-line;
            font-weight: 500;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #44445a;
            font-size: 0.9rem;
            font-weight: 500;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        footer span {
            color: #f5e6a8;
        }

        @media (max-width: 600px) {
            header { padding: 60px 15px 40px; }
            h1 { font-size: 1.9rem; }
            .moon {
                width: 90px;
                height: 90px;
                box-shadow: -15px 8px 0 0 #f5e6a8;
            }
            @keyframes moonGlow {
                0%, 100% {
                    box-shadow: -15px 8px 0 0 #f5e6a8;
                    filter: drop-shadow(0 0 15px rgba(245, 230, 168, 0.4));
                }
                50% {
                    box-shadow: -15px 8px 0 0 #fff8dc;
                    filter: drop-shadow(0 0 25px rgba(245, 230, 168, 0.7));
                }
            }
            .subtitle { font-size: 0.95rem; }
            .poem-card { padding: 28px 22px; }
            .poem-text { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <div class="night-sky" id="sky"></div>

    <header>
        <div class="moon"></div>
        <h1>دفتر شعر نیما اکبری</h1>
        <p class="subtitle">منم نیمه ماه تاریک شب‌ها</p>
        <div class="divider"></div>
    </header>

    <main>
        <div class="poem-card">
            <div class="poem-title">بی‌عنوان</div>
            <div class="poem-text">
شب است و ماه
و من
و کلماتی که
در تاریکی می‌درخشند

اینجا اولین شعر تو قرار می‌گیرد
            </div>
        </div>

        <div class="poem-card">
            <div class="poem-title">نیمه ماه</div>
            <div class="poem-text">
منم نیمه ماه تاریک شب‌ها
            </div>
        </div>
    </main>

    <footer>
        ساخته شده با <span>شب</span> و <span>شعر</span> — © نیما اکبری
    </footer>

    <script>
        const sky = document.getElementById('sky');
        for (let i = 0; i < 120; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2.2 + 0.4;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 4 + 's';
            star.style.animationDuration = (Math.random() * 3 + 3) + 's';
            sky.appendChild(star);
        }
    </script>

</body>
</html>
